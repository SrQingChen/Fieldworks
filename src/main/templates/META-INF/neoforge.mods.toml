# 场域工艺 Fieldworks — mod metadata
license="MPL-2.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
# Chinese displayName written directly here (gradle.properties is ISO-8859-1 and corrupts Chinese).
displayName="场域工艺 Fieldworks"
authors="srqingchen"
description='''
以“场”为核心世界规则的大型科技模组：从读懂脚下的四种自然场开始，到营造人工强场、驾驭巨物多方块、调度整个星球的环境。
A world-rules tech mod built on Fields: read the four natural fields under your feet, grow into artificial strong fields, giant multiblocks, and planetary-scale tuning.
'''

# Dependencies —— neoforge/minecraft 必需；其余为可选软依赖 ——
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[15.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[26.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="[26.1.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jecharacters"
    type="optional"
    versionRange="[4.6.4,)"
    ordering="AFTER"
    side="CLIENT"
